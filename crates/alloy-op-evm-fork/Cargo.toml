[package]
name = "alloy-op-evm"
description = "OP EVM implementation (PRAPH fork with op-revm-praph)"
version = "0.24.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/alloy-rs/evm"
repository = "https://github.com/alloy-rs/evm"

[lints]
workspace = true

[dependencies]
alloy-evm = { workspace = true, features = ["op"] }

alloy-eips.workspace = true
alloy-consensus.workspace = true
alloy-primitives.workspace = true

alloy-op-hardforks.workspace = true
op-alloy-consensus.workspace = true

revm.workspace = true
# PRAPH: Use local op-revm fork instead of upstream op-revm
op-revm = { path = "../op-revm-fork", default-features = false }

thiserror.workspace = true

auto_impl.workspace = true

[dev-dependencies]
alloy-hardforks.workspace = true
test-case.workspace = true

[features]
default = ["std"]
std = [
	"alloy-primitives/std",
	"revm/std",
	"alloy-evm/std",
	"op-revm/std",
	"alloy-consensus/std",
	"alloy-eips/std",
	"op-alloy-consensus/std",
	"thiserror/std"
]
asm-keccak = ["alloy-evm/asm-keccak", "alloy-primitives/asm-keccak", "revm/asm-keccak"]
